<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubHub – Магазин</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="topbar">
<h2>SubHub</h2>
<a href="profile.html"><h2>🙍‍♂️Профиль</h2></a>
</div>

<div class="store">
<div class="cards">

<div class="card"><h3>Spotify</h3><div>2500 ₸ / месяц</div><button onclick="buy('Spotify')">Купить</button></div>
<div class="card"><h3>Apple Music</h3><div>1490 ₸ / месяц</div><button onclick="buy('Apple Music')">Купить</button></div>
<div class="card"><h3>YouTube Premium</h3><div>3500 ₸ / месяц</div><button onclick="buy('YouTube Premium')">Купить</button></div>
<div class="card"><h3>Netflix</h3><div>4000 ₸ / месяц</div><button onclick="buy('Netflix')">Купить</button></div>
<div class="card"><h3>iCloud 50ГБ</h3><div>499 ₸ / месяц</div><button onclick="buy('iCloud 50ГБ')">Купить</button></div>
<div class="card"><h3>Xbox Game Pass</h3><div>3000 ₸ / месяц</div><button onclick="buy('Xbox Game Pass')">Купить</button></div>

</div>
</div>

<div id="paymentModal" style="display:none;">
<div class="container">
<h2>Оплата подписки</h2>
<input type="text" id="cardNumber" placeholder="Номер карты">
<input type="text" id="cardExpiry" placeholder="MM/YY">
<input type="text" id="cardCVC" placeholder="CVC">
<input type="text" id="accountLink" placeholder="Ссылка на ваш аккаунт">
<button onclick="confirmPayment()">Оплатить</button>
<button onclick="closePayment()">Отмена</button>
</div>
</div>

<script src="script.js"></script>
</body>
